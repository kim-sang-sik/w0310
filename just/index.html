<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUST 쇼핑몰</title>
    <!-- 외부 스타일 방식 -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- 전체 콘텐츠 가로 크기 1200, 가운데 배치 -->
    <div class="wrap">
        <header class="header">
            <h1 class="logo"></h1>
            <!-- gnb: global navigation bar - 웹 사이트의 모든 페이지에 존재하는 내비게이션 -->
            <nav class="gnb"></nav>
        </header>
        <!-- div.slide 또는 .slide 탭 -->
        <div class="slide"></div>
        <div class="contents">
            <div class="notice"></div>
            <div class="banner"></div>
            <div class="shortcut"></div>
        </div>
        <footer class="footer">
            <div class="blogo"></div>
            <div class="copy"></div>
            <div class="sns"></div>
        </footer>
    </div>
</body>

</html>
