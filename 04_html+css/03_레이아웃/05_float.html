<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html+css</title>
    <style>
        body {
            margin: 0;
        }
        /* 
            블록 레벨 요소
            width: auto; -> 부모 크기의 100%
         */
        h1, 
        p { 
            margin: 0;
            border: 1px solid #000;
        }
        p{

            width: 500px;
            /* 영문의 경우 justify와 break-all을 함께 사용한다. */
            text-align: justify;
            word-break: break-all;
            color: darkgreen;
        }

        p strong {
            font-size: 1.2em;
        }

        h1 {
            /* float "뜨다" */
            /* h1이 다른요소에 왼쪽에 배치 */
            float: left;
            background: brown;
            margin: 15px 10px 5px 16px;
            padding: 3px 10px;
            /* font-size: 2em%; 기본값 => 200% */
            color: #fff;
        }
        span {
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <h1>flo<br>at</h1>
    <p><strong>강한 강조</strong>Lorem ipsum dolor sit, amet consectetur adipisicing elit.
        Veritatis accusantium <span>possimus</span> non <b>디자인으로 굵게</b> veniam! Nobis error 
        laudantium tempore molestiae, eaque blanditiis officia!</p>
    
</body>
</html>
