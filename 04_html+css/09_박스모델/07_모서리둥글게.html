<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border-radius</title>
    <style>

        /* 
            개별속성
                border-top-left-radius
                border-top-right-radius
                border-bottom-left-radius
                border-bottom-right-radius

            속기속성
                border-radius: 값;
                border-radius: 값 값;
                border-radius: 값 값 값;
                border-radius: TL(상왼) TR(상오) BR(하오) BL(하왼);

        */
        div {
            width: 200px;
            height: 200px;
            background: green;
            /* 가로 또는 세로 크기가 같고, border-radius를 가로 또는 세로의 1/2이상 지정하면 원 또는 타원 */
            /* 1/2이하의 크기면 둥근사각형 */
            border-radius: 50px;
        }
    </style>
</head>
<body>
    
</body>
</html>
