<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>속성 선택자</title>
    <style>
        /* 
            속성 선택자
            선택자[HTML속성]
            [속성] : 속성이 존재하는 모든 요소를 선택
            [속성="값"] : 속성이 특정 값인 요소를 선택

            [속성~="값"] : 속성이 특정 단어를 포함하는 요소를 선택
            [속성|="값"] : 속성이 특정 단어로 시작하는 요소를 선택

            [속성^="값"] : 속성이 특정 값으로 시작하는 요소를 선택
            [속성$="값"] : 속성이 특정 값으로 끝나는 요소를 선택    
            [속성*="값"] : 속성이 특정 값을 포함하는 요소를 선택
        */
        [title] {color: blue;}
        p[class="icox"] {color: red;}
        
        /* 값을 포함하는 */
        /* p[class~="icox"] {color: green;} */
        /* 값으로 시작하는 */
        p[class|="icox"] {color: orange;}
        /* 값으로 시작하는 */
        p[class^="icox"] {color: brown;} 
        p[class$="icox"] {color: purple;}
        /* 값을 포함하는 */
        /* p[class*="icox"] {color: pink;} */
    </style>
</head>
<body>
    <h3 class="logo" title="logo">서울특별시</h3>
    <h3>경기도</h3>
    <p class="icox" title="logo">icox</p>
    <p class="icoxpage">icoxpage</p>
    <p class="screenicox">screenicox</p>
    <p class="I icox U">I icox U</p>
    <p class="icox-1">icox-1</p>
</body>
</html>
