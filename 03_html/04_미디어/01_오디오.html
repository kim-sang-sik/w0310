<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html</title>
</head>
<body>
    <!-- 
        1bit(binary digit): 0, 1
        8bit = 1byte

        6,846KB
        저장 용량: B(btye, 바이트)
        B(btye)
        1000byte = 1KB
        1000KB = 1MB(메가)
        1000MB = 1GB(기가)
        1000GB = 1TB(테라)

        속성
            src: 오피오 파일 경로
            autoplay: 자동 실행
            muted: 음소거
            loop: 무한 반복
            controls: 컨트롤 표시
            preload: 미리 로드 방식
                auto: 일부 또는 전체를 미리 로드한다.(기본값)
                metadata: 오디오의 메터데이터(길이, 제목, 등)만 미리 로드한다.
                none: 미리 로드하지 않음
    -->
    <h1>오디오</h1>
    <audio src="./asset/MasCafe-CasaRosa.mp3" autoplay></audio>
    <!-- 파일 이름에에 공백 사용하지말것 -->
    <!-- 표준 -->
    <audio controls>
        <source src="./asset/MasCafe-CasaRosa.mp3" type="audio/mp3">
        <source src="./asset/MasCafe-CasaRosa.mp3" type="audio/ogg">
        <source src="./asset/MasCafe-CasaRosa.mp3" type="audio/wav">
        your browser does not support the audio elment(당신의 부라우저는
        오디오 요소를 지원하지 않습니다.)
    </audio>
</body>
</html>
