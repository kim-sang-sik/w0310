<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html+css</title>
    <style>
        div,
        span {
            border: 1px solid #000;
        }

        .div1 {
            display: block;
            width: 500px;
        }

        .div2 {
            display: inline;
            /* width: 200px; -> 적용x*/
        }

        .div3 {
            display: inline-block;
            width: 200px;
        }

        .div4 {
            display: none;
        }

        .span1 {
            display: block;
        }

        .span2 {
            display: inline;
        }

        .span3 {
            display: inline-block;
        }

        .span4 {
            display: none;
        }
    </style>
</head>

<body>
    <div class="div1">div1박스</div>
    <div class="div2">div2박스</div>
    <div class="div3">div3박스</div>
    <div class="div4">div4박스</div>
    <span class="span1">span박스1</span>
    <span class="span2">span박스2</span>
    <span class="span3">span박스3</span>
    <span class="span4">span박스4</span>

</body>

</html>
