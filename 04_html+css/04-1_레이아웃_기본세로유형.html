<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레이아웃-기본세로유형</title>
    <STYle>
        /* shift+alt+f 들여쓰기 */
        /*         
            선택자의 종류
            1.태그(요소, 타입) 선택자
            2. .클래스 선택자
        */
        div {
            width: 600px;
            height: 50px;
            background-color: #ccc;
        }
        .header {height: 50px;}
        .slide {height: 150px; background: #e14444;}
        .content {height: 100px; background: #42ebab;}
        .feeter {height: 50px;} 
    </STYle>
</head>

<body>
    <div class="header">헤더</div>
    <div class="slide">슬라이드</div>
    <div class="content">콘텐츠</div>
    <div class="feeter">푸터</div>
</body>

</html>
