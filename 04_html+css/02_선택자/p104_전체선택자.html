<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전체 선택자</title>
    <style>
        /* 
            전체 - *(별표)
            그러나 불필요하게 전체 선택자를 사용하는 것은 속도를 저하시키는
            원인이 되므로, 반드시 필요한 경우가 아니면 선택자를 정확하게
            명시하는 것을 권장한다.
        */
        /* 
            *는 전체 -> html포함 안의 모든 태그(head태그와 head안의 태그는 제외)
            -> html, body, h1, h2, p
        */
        /* 요소 전체 */
        * {color: blue;}
    </style>
</head>
<body>
    <h2>순서없는 목록</h2>
    <ul>
        <li>목록1</li>
        <li>목록2</li>
        <li>목록3</li>
        <li>목록4</li>
    </ul>
    <p class="ctxt">Lorem ipsum dolor sit.</p>
</body>
</html>
