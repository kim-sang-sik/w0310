<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>type 선택자</title>
    <style>
        /* 
            기본 선택자
                1. element(type, tag) - html태그 이름
                2. class - .이름
                3. id - #이름
                4. 그룹 - ,(콤마)
                5. 전체 - *(별표)
        */
        /* 본문(body)의 p태그를 선택하여 글자색을 빨강으로 지정한다. */
        p {
            /* 글자색을 파랑으로 */
            color: blue;
        }
    </style>
</head>
<body>
    <p>요소 선택자란 HTML 태그명을 선택자로 사용한다.</p>
</body>
</html>
