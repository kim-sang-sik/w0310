<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transition(전환)</title>
    <style>
        /* 
            지정한 시간동안 부드럽게 속성을 전환(property)한다.
            참고로 display, position, z-index, overflow,
            visibility, font-family, boxsizing 등은 적용되지 않는다
            개별 속성
                transition-property: all;
                transition-duration: 1s(단위: 초)(기본값이 0s)
                transition-timing-function
                    값: 가속 -  ease(기본값) -> cubic-bezier(0.25,0.1,0.25,1)
                                ease-in(느림-빠름) -> cubic-bezier(0.42,0,1,1)
                                ease-out(빠름-느림) -> cubic-bezier(0,0,0.58,1)
                                ease-in-out(느림-빠름-느림) -> cubic-bezier(0.42,0,0.58,1)
                        등속 - linear
                        cubic-bezier(n,n,n,n) -> n은 -~1사이 값
                transition-delay: 1s(단위: 초)(기본값이 0s)

            속기 속성
                transition: [속성명] 전환시간 [가속도] [지연시간];

        */
    </style>
</head>
<body>
    
</body>
</html>
