<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS의 형식</title>
    <style>
        /* 
          선택자 {선언부}  
          선택자 {
                속성: 속성값;  
                속성: 속성값;  
                .....
                }  
        */
    /* 
        선택자의 종류
        1. 기본 선택자
        2. 결합자 (combinator) 선택자
        3. pseudo-clas 선택자(슈도, 유사, pseudo-class) 선택자
        4. 의사요소(슈도, 유사, pseudo-elments) 선택자
        5. 속성(attribute) 선택자
    */
    /*  
        기본선택자
            1. elments(type) 선택자 - 태그 이름을 선택자로 사용
            2. class 선택자 - .클래스이름
            3. id 선택자 - #id이름
            4. 그룹 선택자 - ,(콤마)
            5. 전체 선택자 - *(별표)
    */
    /* 본문(body)의 p태그를 선택하여 글자색을 빨강으로 지정한다 */
    h1 {
        /* 글자색을 빨강으로 */
        color: red;
        background: yellow;
    }
    </style>
</head>
<body>
    <h1>CSS의 형식</h1>
</body>
</html>
