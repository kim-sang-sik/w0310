<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position:absolute;</title>
    <style>

        body {
            margin: 0;
        }
        .wrap {
            display: flex;
            height: 850px;
        }
        header {
            width: 200px;
            background: yellow;
        }
        /* 레이아웃 작업시 가급적 요소의 기본 배치를 꺠지 않는 
        방법으로 하는 것이 바람직 하다 */
        .containel {
            width: calc(100% - 200px);
        }
        .slide {
            height: 400px;
            background: orange;
        }
        .contents {
            height: 450px;
            background: lightblue;
        }
        .link {
            position: absolute;
            right: 0;
            top: 0;
            width: 120px;
            height: 300px;
            background: lightcoral;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>헤더</header>
        <div class="containel">
            <div class="slide">이미지</div>
            <div class="contents">
                <div class="link">링크</div>
            </div>
        </div>
    </div>
</body>
</html>
