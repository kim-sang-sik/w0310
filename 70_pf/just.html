<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUST쇼핑몰</title>
    <style>
        /* 전체 */
        * {
            margin: 0;
         }
        body {
            margin: 0; background: #fff;
        }
        /* 가로 중앙 배치 - width를 지정한 후 margin: 0 auto; 를 지정한다. */

        .wrap {
            width: 1200px; margin:0 auto;
        }
        /* 헤더 */
        header {
            /* 부모 요소에 display: flex;를 적용하면 자식 요소가
            가로 배치된다 */
            display: flex; height: 100px;
        }
        /* 로고 */
        .logo { 
            width: 200px;
            background: #eee;
        }
        /* 내비게이션 */
        nav {
            width: 1000px;
            background: #ddd;
        }
        /* 슬라이드 */
        .slide {
            display: flex;
            background: #ccc; 
            height: 300px;
        }

        /* 콘텐츠 */
        .contents {
            display: flex;
            height: 200px;
        }
        /* 공지사항 */
        .notice{
            width: 400px;
           background: #bbb;
        }
        /* 배너 */
        .banner{
            width: 400px;
            background: #aaa;
        }
        .shortcut{
            width: 400px;
            background: #999;
        }
        /* 푸터 */
        footer {
            display: flex;
            height: 100px;
        }
        /* 하단로고 */
        .blogo {
            width: 200px;
            background: #888;
        }
        /* 주소 및 저작권 */
        .copy {
            width: 800px;
            background: #777;
        }
        /* SNS */
        .sns { 
            width: 200px;
            background: #555;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <!-- 로고 -->
             <h1 class="logo"><a href="#"><img src="./../index_01.png" alt="로고"></a></h1>
            <!-- 내비게이션 -->
             <nav class="gnb"><img src="./../index_02.png" alt="내비게이션"></nav>
        </header>
        <!-- div.slide -->
        <div class="slide">
            <img src="./../index_03.png" alt="슬라이드 이미지1">
        </div>
        <div class="contents">
            <!-- 공지사항 -->
             <div class="notice">
                <img src="./../index_04.png" alt="공지사항">
             </div>
            <!-- 배너 -->
             <div class="banner">
                <a href="#"><img src="./../index_05.jpg" alt="배너"></a>
             </div>
            <!-- 바로가기 -->
             <div class="shortcut">
                <a href="#"><img src="./../index_06.png" alt="바로가기"></a>
             </div>
        </div>
        <footer>
            <!-- 하단로고 -->
             <div class="blogo">
                <a href="#"><img src="./../index_07.png" alt="하단로고"></a>
             </div>
            <!-- 주소 및 저작권 -->
             <div class="copy">
                <img src="./../index_08.png" alt="저작권">
             </div>
            <!-- SNS는 -->
             <div class="sns">
                <img src="./../index_09.png" alt="sns">
             </div>
        </footer>
    </div>
</body>
</html>
