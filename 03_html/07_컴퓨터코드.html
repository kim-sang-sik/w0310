<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html</title>
</head>
<body>
    <h1>컴퓨터 코드</h1>
    <!--
    code: 컴퓨터 고트조각
    kbd: 키보드 입력
    samp: 컴퓨터 프로그램의 샘플조각
    var: 프로그래밍 또는 수학적변수에서 변수
    -->
    <code>
        <!-- 자바 스크립트: var -> let, const-->
       var x = 5;
       let y = 6;
       const z = x + y;
    </code>

    <script>
        <!-- 자바 스크립트: var -> let, const-->
       var x = 5;
       let y = 6;
       const z = x + y;
    </script>

    <p></p>

    <p>파일을 저장할 때는 <kbd>ctrl+s</kbd>를 누른다.</p>

    <samp>입력한주소가 잘못되었습니다<br> 좋은 말로 할때 돌아가</samp>
</body>
</html>
