<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html</title>
</head>
<body>
    <h1>멀티미디어</h1>
    <!-- 
         이미지: png(투명 배경), gif (애니메이션), jpq
         비디오: mp4, webm, fgv(ogg)
         오디오: mp3, wav, ogg
    -->
         <!-- 
            무료이미지 및 비디오 다운
            1.픽셀베이: https://pixabay.com/ -> 이미지 및 비디오
            2.픽셀즈: https://www.pexels.com/ko-kr/ ->이미지 및 비디오
            3.언스플레쉬:https://unsplash.com/ko -> 이미지   
         -->
         <img src="./../70_pf/just/main.jpg" alt="이미지의 설명글" width="400"><br>
         <!-- 
            비디오와 오디오 속성
            1.autoplay: 자동 실행
            2.muted: 무음
            3.controls: 제어바(실행, 정지)
            4.loop:무한 반복
         -->
         <video src="./3065047-hd_1920_1080_30fps.mp4" autoplay muted loop width="400"></video><br>
         <video src="./3065047-hd_1920_1080_30fps.mp4" controls width="400"></video><br>
        <!-- 
            파일 변환 프로그램 
                mp4<->webm<->ogv
        -->
        <!-- 
            풀스크린 비디오
            경남 아너스빌:https://www.honorsville.co.kr/
            대우건설:https://www.daewooenc.com/
            -->
         <video autoplay muted loop width="400"><br>
            <source src="./main_movie_new_250212.mp4" type="video/mp4">
            <source src="./main_movie_new_250212.webm" type="video/webm">
            <source src="./main_movie_new_250212.ogv" type="video/ogv">
         </video>

         <!-- 유튜브 등등 소스 구해서 붙이기 -->
         <iframe width="400" height="225" src="https://www.youtube.com/embed/86gToHFkbiU" style="width: 400px; height: 225px;"></iframe>
         <iframe src="https://www.youtube.com/embed/RUAmQF4dEMU"" style="width: 400px; height: 225px;"></iframe>
        <iframe width="400" height="225" src="https://www.youtube.com/embed/7exqPVa4W6I" style="width: 400px; height: 225px;"></iframe>
         <!-- 비메오 -->

         <iframe src="https://vimeo.com/153760150"></iframe>

        <!-- 오디오 -->
        <audio src="./Mas Cafe - Casa Rosa.mp3" controls autoplay muted></audio>
        <!-- 배경음악 -->
        <audio src="./Mas Cafe - Casa Rosa.mp3" autoplay muted loop></audio>
        
        <audio controls>
            <source src="./Mas Cafe - Casa Rosa.mp3" type="audio/mpeg">
            <source src="./Mas Cafe - Casa Rosa.mp3" type="audio/wav">
            <source src="./Mas Cafe - Casa Rosa.mp3" type="audio/ogg">
        </audio>
        
        <!-- 
        당신의 브라우저는 오디오 태그를 지원하지 않는다.
    -->
</body>
</html>
