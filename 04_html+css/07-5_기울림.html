<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html+css</title>
    <style>
        .span1 {font-style: italic; /* fs */}
        .span2 {font-style: oblique; /* 비스듬한 */}
    </style>
</head>
<body>
    <h1>글자 기울임</h1>
    <span class="span1">기울임</span><br>
    <span class="span2">기울임</span><br>
    <em>기울임</em><br>
    <i>기울임</i> 
</body>
</html>
