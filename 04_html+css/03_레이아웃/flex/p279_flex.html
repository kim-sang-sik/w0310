<!DOCTYPE html>
<!-- en: 영문 페이지, ko: 한글 페이지, zh: 중국 페이지, ja: 일본 페이지 -->
<!-- https://www.w3schools.com/TAgs/ref_language_codes.asp -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexiabl방식</title>
    <style>
        /* 
            어떤요소에 display:flex;를 지정하면
            그 요소는 플렉스 컨테니어가 되고, 
            자식 요소은 플렉스 아이템이 된다.
        */

        /* 
            플렉스 컨테이너에 지정 가능한 속성
                1. flex-direction - 방향 + flex-wrap - 줄 바꿈 방식 = flex-flow: direction wrap;
                2. justify-content - alugn(정렬, 맞춤)/ 가로/세로 정렬
                3. align-items - 정렬
                4. align-conrent - 정렬(여러줄)
                
            플렉스 아이템
                1. align-self -정렬
                2. flex-grow - 성장 + flex-shrink (fls) - 수축 + flex-basis(flb) - 가로 크기 초기값 = flex: 1;
                3. order - 자식 요서의 순서
        */
        .flexbox{
            /* 가로배치: width가 자식 크기, height는 부모크기의 100% */
            height: 200px;
            outline: 1px solid red;
            display: flex; /* DF */
            /* display: -webkit-flex; 
            display: -ms-flexbox;  이제는 안씀*/
            flex-direction: row;
            flex-wrap: wrap;
            background: #ccc;
        }
        .flexbox > div {
            flex: 1;
            -webkit-flex: 1;
            -ms-flex: 1;
            background: darkcyan;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="flexbox">
        <!-- 블록레벨요소는 width는 부모 크기의 100% 이며,
        줄바꿈되기 때문에 세로(위에서 아래로) 배치된다.
        height는 자식 크기 만큼 지정된다. -->
        <div>flex-item</div>
        <div>flex-item</div>
        <div>flex-item</div>
    </div>
</body>
</html>
