<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html</title>
</head>
<body>
    <h1>폼</h1>
    <h2>input태그의 23개 타입</h2>

    <!-- https://caniuse.com/ 사용가능한거 확인-->
    
    <!-- 기존방식 -->
    입력상자<input type="text">
    비밀번호<input type="password">
    <!-- 웹 양식에 추가적인 데이터를 포함시킬 경우 사용 -->
    숨김필드<input type="hidden">

    <!-- 버튼 -->
    전송<input type="submit">
    취소<input type="reset">
    버튼<input type="button">
    이미지<input type="image">
    파일첨부<input type="file">
    
    <!-- 여러 개 중 여러개를 선택 가능 -->
    <input type="checkbox">네모1
    <input type="checkbox">네모2
    <input type="checkbox">네모3
    
    <!-- 여러 개 중 하나만 선택 가능 -->
    <input type="radio">동그라미1
    <input type="radio">동그라미2
    <input type="radio">동그라미3
    
    <!-- 업데이트 이후 새분화 되어있는 새로운 타입 -->
    검색<input type="search">
    전화번호<input type="tel">
    이메일<input type="email">
    웹주소<input type="url">
    
    <!-- 날짜/시간 -->
    1<input type="date">
    <!-- datetime-local을 사용하고 datetime 사용하지 않는다.  -->
    2<input type="datetime"> <!-- 모든 브라우저 지원: X -->
    3<input type="datetime-local">
    4<input type="month"> <!-- 파폭137, 윈도우 사파리 지원: X -->
    5<input type="time"> <!-- 파폭137, 윈도우 사파리 지원: X -->
    6<input type="week"> <!-- 파폭137, 윈도우 사파리 지원: X -->
    
    <!-- 색 -->
    <input type="color">
    
    <!-- 범위 -->
    <input type="range">
    
    <!-- 스핀 버튼 -->
    <input type="number">

</body>
</html>
