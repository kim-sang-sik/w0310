<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인접 형제 선택자</title>
    <style>
        /* 
            형제선책자-> 선택자를 +으로 구분
            선택자 + 선택자
            형+ 인접한 동생
        */
        /* h1 바로 아래 동생 p를 선택하여 */
        h1 + p{
            color: #ad2d2d;
        }
    </style>
</head>
<body>
    <h1>h1의 인접한 동생은 첫 번째 p이다.</h1>
    <p>첫 번째 p의 인접한 동생은 바로 아래 두 번째 p 이다.</p>
    <p>p는 div의 세 번쨰 자식이다</p>
</body>
</html>
