<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>outline</title>
    <style>
        div {
            margin: 30px;
            border: 10px solid #aaa;
            /* outline은 상하좌우 따로 지정 불가능하다. */
            outline: 5px solid red; /* outline 속성 */
            /* 테두리와 외곽선 사이 간격 */
            outline-offset: 10px; /* outline-offset 속성 */

        }
    </style>
</head>
<body>
    <div>박스</div>
</body>
</html>
