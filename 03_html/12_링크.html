<body>
    <h1>링크</h1>
    <!-- anchor(맹커, 닻)
    href은 필수 속성
        URL -> HTTP://~, HTTPS://~
        파일 -> 경로/파일명(./ , ../)
        메일 -> mailto:~
        전화번호 -> tel:~

    프로토콜(protocal, 통신 규약)
        컴퓨터나 전자 기기 간의 통신 방식을 정의
    http, https, mailto, tel, ftp, smtp, pop, tcp/ip......

    target 선택 속성
    target="_self" -> 기본값으로 현재창으로 열린다
    target="_blank" -> 새 창으로 열린다
    target="_TOP" -> 최상위(루트 ROOT) 페이지로 열린다
    target="_parent" -> 부모 페이지로 열린다
    href(hyper reference) =하이퍼 링커
    -->
    <!-- 타깃 사이트-->
    <a href="https://www.naver.com">버튼</a>
    <!-- 타 사이트-->
    <a href="https://google.com"> <target="block">구글</target></a>

    <!-- 이메일-->
    <a href="mailto:akzpdlcb1@naver.com">이메일</a>
    <!-- 전화번호 -->
    <a href="tel:010-8972-2309">보이스피싱 010-8972-2309</a>
