<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상단 고정 헤더</title>
    <style>
        /* 
            fixed의 상단 고정 헤더
        */
        body {
            margin: 30px;
        }
        /* 상단 고정 헤더 */
        header {
            position: fixed;
            width: 100%;
            top: 20px;
            left: 50px;
            height: 100px;
            background: blue;
        }
        section {
            height: 900px;
        }
    </style>
</head>
<body>
    <header>헤더</header>
    <section>1</section>
    <section>2</section>
    <section>3</section>
    <section>4</section>
    <footer>푸터</footer>
</body>
</html>
