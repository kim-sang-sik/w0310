<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html+css</title>
    <style>
        /* 
            형제선책자-> 선택자를 +으로 구분
            선택자 + 선택자
            인접 형 + 제 선택자
            예]첫째자식 ~ 셋째자식 (x)
            예]둘째자식 ~ 셋째자식 (0)
            예]첫쨰자식 ~ 둘째자식 (0)
        */
        /* h1 바로 아래 동생 p를 선택하여 */
        .h1 + p{
            color: #ad2d2d;
        }
    </style>
</head>
<body>
    <dav class="abox">
        <h1>p는 div첫 번째 자식이다</h1>
        <div>p는 div의 두 번째 자식이다</div>
        <p>p는 div의 세 번쨰 자식이다</p>
        <ul>
            <li>
                <p>p는 첫 번째 li의 자식, div의 손자이다</p>
            </li>
            <li>
                <p>p는 첫 번쨰 li의 자식, div의 손자이다</p>
            </li>
        </ul>
    </dav>
    <p>p는 body의 자식이다</p>
</body>
</html>
