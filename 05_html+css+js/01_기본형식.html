<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트의 기본 방법</title>
    <!-- 외부스타일 -->
    <link rel="stylesheet" href=" 스타일시트.css">
    <!-- 내부스타일 -->
    <style>
        div {
            width: 100px;
            height: 100px;
            background:red;
        }
    </style>
    <!-- 내부 스크립트 -->
     <script>
        // 문장끝에는 ;를 붙인다
        // 경고창
        window.alert("자바스크립트 학습을 시작하겠습니다.");
        // 문서 출력
        document.write("자바스크립트 실행문");
        // 콘솔 로그
        console.log("F12를 누르면 볼 수 있다");
     </script>
    <!-- 외부 스크립트 -->
     <script src="자바스크립트파일.js"></script>
</head>
<body>
    <!-- 인라인 스크립트 -->
    <!-- div를 클릭하면 alert()을 호출한다 -->
     <!-- onclick은 html의 이밴트 속성 -->
    <div onclick="alert('인라인 스크립트')";>박스</div>
</body>
</html>
